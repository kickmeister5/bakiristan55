<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garaj Arena — HTML ekran önizlemesi</title><link rel="icon" href="dist/assets/favicon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#101017;color:#eeeaf5;font-family:Segoe UI,Arial,sans-serif}header{padding:18px 24px;background:#1c1826;border-bottom:1px solid #403447}h1{font-size:18px;margin:0 0 7px}p{font-size:13px;color:#bbb2c9;line-height:1.6;margin:0}a{color:#cfbbff}nav{display:flex;gap:7px;flex-wrap:wrap;padding:13px 24px;background:#15121d}nav a{font-size:13px;padding:9px 13px;border-radius:8px;color:#cfc8da;text-decoration:none;border:1px solid #373041}nav a.active{background:#a58aff;color:#1b102b;border-color:#a58aff}iframe{display:block;width:100%;height:calc(100vh - 152px);border:0;min-height:500px;background:#101017}@media(max-width:600px){header,nav{padding:14px}iframe{height:calc(100vh - 230px)}}@media(prefers-color-scheme:dark){body{color-scheme:dark}}</style></head><body><header><h1>GARAJ ARENA · HTML ekran önizlemesi</h1><p>Ekranlar arasında geçiş yapabilirsin. Bunlar tasarım önizlemeleridir; kayıt ve oyun işlemleri yapmaz. Çalışan proje için <strong>baslat.cmd</strong> dosyasını açıp <a href="http://localhost:4173" target="_blank">yerel oyuna git</a>.</p></header><nav aria-label="Ekranlar"><a href="onizleme/game.html" target="screen" class="active">Oyun ekranı</a><a href="onizleme/admin.html" target="screen" >Admin paneli</a><a href="onizleme/editor.html" target="screen" >Araç düzenleme</a><a href="onizleme/home.html" target="screen" >Oda oluşturma</a><a href="onizleme/lobby.html" target="screen" >Lobi</a><a href="onizleme/result.html" target="screen" >Tur sonucu</a><a href="onizleme/final.html" target="screen" >Final sıralaması</a></nav><iframe src="onizleme/game.html" name="screen" title="Garaj Arena ekran önizlemesi"></iframe><script>document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',()=>{document.querySelectorAll('nav a').forEach(x=>x.classList.remove('active'));a.classList.add('active');document.querySelector('iframe').title=a.textContent;}));</script></body></html>
