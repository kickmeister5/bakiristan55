<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrom · Fizik Prototipi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Outfit:wght@500;600;700;800&display=swap');
:root{--ink:#061321;--gold:#f4cc62;--cyan:#75e7ff;--panel:#091f34}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#17456e,#061525 60%,#020914);font-family:Outfit,Arial;color:#effaff;display:grid;place-items:center;padding:24px;overflow:hidden}.app{width:min(1120px,96vw);display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:18px;align-items:center}.board-wrap{position:relative;padding:16px;border:1px solid #f4cc6270;background:linear-gradient(135deg,#39220e,#a26424 8%,#eac77a 12%,#7b4517 94%);box-shadow:0 25px 70px #0009;border-radius:12px}.board-wrap:before{content:"";position:absolute;inset:7px;border:3px solid #3d220f;border-radius:8px;pointer-events:none}canvas{display:block;width:100%;aspect-ratio:1;border-radius:5px;touch-action:none;cursor:crosshair}.panel{background:#071d32e8;border:1px solid #65ddf055;padding:20px;box-shadow:0 15px 40px #0008}.eyebrow{font:800 11px Outfit;letter-spacing:3px;color:var(--gold)}h1{font:800 43px "Barlow Condensed";letter-spacing:2px;margin:4px 0 2px}.status{min-height:37px;margin:14px 0;padding:9px;border-left:3px solid var(--cyan);background:#061423;color:#c5dfeb;font-size:12px;line-height:1.35}.score{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.score div{border:1px solid #ffffff24;background:#06172a;padding:10px;text-align:center}.score b{display:block;font:800 30px "Barlow Condensed";color:var(--gold)}.tip{font-size:12px;line-height:1.6;color:#aac7d9}.legend{margin:14px 0;display:grid;gap:7px;font-size:12px}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:-1px}.btn{width:100%;margin-top:12px;padding:11px;border:1px solid var(--gold);background:linear-gradient(135deg,#ffe98b,#bd7920);color:#16212e;font:800 19px "Barlow Condensed";letter-spacing:1px;cursor:pointer}.power{height:7px;border:1px solid #ffffff35;background:#04111f;margin-top:9px}.power i{display:block;height:100%;width:0;background:linear-gradient(90deg,#75e7ff,#ffe06b,#ff6b80);transition:width .05s}@media(max-width:820px){body{overflow:auto}.app{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel h1,.panel .eyebrow,.panel .status,.panel .tip,.panel .legend,.panel .btn,.panel .power{grid-column:1/-1}}@media(max-width:460px){.panel{grid-template-columns:1fr}}
.home-return.home-return-fallback{background:linear-gradient(135deg,#e94ee6,#ff7395)!important;border:0!important}.home-return.home-return-fallback:after{content:"←";font:900 31px/1 Arial;color:#080814;text-shadow:none}</style></head><body><style id="home-return-style">.home-return{position:fixed;top:18px;left:18px;z-index:999999;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:rgba(10,12,22,.6);border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 22px rgba(0,0,0,.32);backdrop-filter:blur(8px);transition:transform .2s ease,box-shadow .2s ease,background .2s ease}.home-return img{display:block;width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}.home-return:hover{transform:translateX(-2px) scale(1.08);background:rgba(18,21,35,.88);box-shadow:0 12px 28px rgba(0,0,0,.44)}.home-return:focus-visible{outline:3px solid #fff;outline-offset:3px}@media(max-width:640px){.home-return{top:12px;left:12px;width:42px;height:42px}.home-return img{width:30px;height:30px}}.home-return.home-return-fallback{background:linear-gradient(135deg,#e94ee6,#ff7395)!important;border:0!important}.home-return.home-return-fallback:after{content:"←";font:900 31px/1 Arial;color:#080814;text-shadow:none}</style><a class="home-return" href="index.html" aria-label="Ana sayfaya dön" title="Ana sayfaya dön"><img src="home-return.png" alt="" onerror="this.parentElement.classList.add('home-return-fallback');this.remove()"></a><main class="app"><div class="board-wrap"><canvas id="board" width="800" height="800"></canvas></div><aside class="panel"><div class="eyebrow">FİZİK PROTOTİPİ</div><h1>CARROM</h1><div class="status" id="status">Striker'ı sürükleyerek konumlandır. Ardından ters yöne çekip bırak.</div><div class="score"><div>CEBE GİREN<b id="pocketed">0</b></div><div>ATIŞ<b id="shots">0</b></div></div><div class="power"><i id="power"></i></div><div class="legend"><span><i class="dot" style="background:#f1eee2"></i>Beyaz taş</span><span><i class="dot" style="background:#1a2027;border:1px solid #fff5"></i>Siyah taş</span><span><i class="dot" style="background:#cf3344"></i>Kırmızı kraliçe</span></div><div class="tip">Striker alt çizgideyken fareyle seç. Geri çektiğin mesafe vuruş gücünü belirler. Tüm taşlar durmadan yeni atış yapılamaz.</div><button class="btn" id="reset">TAHTAYI SIFIRLA</button></aside></main>
<script>
const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),W=800,margin=65,play=670,R=17,STR=23,pockets=[{x:margin,y:margin},{x:W-margin,y:margin},{x:margin,y:W-margin},{x:W-margin,y:W-margin}];
let discs=[],drag=null,moving=false,shots=0,pocketed=0,last=performance.now();
const stat=document.querySelector('#status'),power=document.querySelector('#power');
function disk(x,y,r,color,type='coin'){return{x,y,vx:0,vy:0,r,color,type,alive:true}}
function reset(){discs=[];shots=0;pocketed=0;const c=W/2;discs.push(disk(c,c,16,'#cf3344','queen'));const ring=[[0,-1],[.87,-.5],[.87,.5],[0,1],[-.87,.5],[-.87,-.5]];ring.forEach((p,i)=>discs.push(disk(c+p[0]*37,c+p[1]*37,16,i%2?'#1d252e':'#f1eee2')));ring.forEach((p,i)=>discs.push(disk(c+p[0]*74,c+p[1]*74,16,i%2?'#f1eee2':'#1d252e')));discs.push(disk(c,W-margin-44,STR,'#eebd49','striker'));updateUI();stat.textContent="Striker'ı sürükleyerek konumlandır. Ardından ters yöne çekip bırak.";draw()}
function striker(){return discs.find(d=>d.type==='striker')}
function updateUI(){document.querySelector('#pocketed').textContent=pocketed;document.querySelector('#shots').textContent=shots}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*W/r.height}}
function allStill(){return !discs.some(d=>d.alive&&(Math.abs(d.vx)+Math.abs(d.vy)>5))}
canvas.addEventListener('pointerdown',e=>{const p=point(e),s=striker();if(!s||!allStill())return;const dx=p.x-s.x,dy=p.y-s.y;if(Math.hypot(dx,dy)<58){drag={current:p};canvas.setPointerCapture(e.pointerId)}})
canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),s=striker();drag.current=p;const dx=p.x-s.x,dy=p.y-s.y,dist=Math.min(210,Math.hypot(dx,dy));power.style.width=(dist/210*100)+'%';draw()})
canvas.addEventListener('pointerup',e=>{if(!drag)return;const s=striker(),pull=drag.current,dx=s.x-pull.x,dy=s.y-pull.y,dist=Math.min(210,Math.hypot(dx,dy));if(dist>12){s.vx=dx/dist*dist*4.6;s.vy=dy/dist*dist*4.6;shots++;stat.textContent='Taşlar hareket ediyor…';moving=true;updateUI()}drag=null;power.style.width='0';draw()})
function walls(d){if(pockets.some(p=>Math.hypot(d.x-p.x,d.y-p.y)<66))return;const min=margin+11,max=W-margin-11;if(d.x-d.r<min){d.x=min+d.r;d.vx=Math.abs(d.vx)*.82}if(d.x+d.r>max){d.x=max-d.r;d.vx=-Math.abs(d.vx)*.82}if(d.y-d.r<min){d.y=min+d.r;d.vy=Math.abs(d.vy)*.82}if(d.y+d.r>max){d.y=max-d.r;d.vy=-Math.abs(d.vy)*.82}}
function collide(a,b){const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),min=a.r+b.r;if(!dist||dist>=min)return;const nx=dx/dist,ny=dy/dist,over=min-dist;a.x-=nx*over/2;a.y-=ny*over/2; b.x+=nx*over/2;b.y+=ny*over/2;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel>0)return;const imp=-rel*.93;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny}
function pocket(d){for(const p of pockets)if(Math.hypot(d.x-p.x,d.y-p.y)<38){d.alive=false;if(d.type==='striker'){stat.textContent='Striker cebe girdi. Yeni atış için taşlar duruyor…';setTimeout(placeStriker,400)}else{pocketed++;stat.textContent=d.type==='queen'?'Kraliçe cebe girdi!':'Taş cebe girdi!';updateUI()}return true}return false}
function placeStriker(){const s=striker();if(s){s.alive=true;s.x=W/2;s.y=W-margin-44;s.vx=s.vy=0}}
function physics(dt){for(const d of discs){if(!d.alive)continue;d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=Math.pow(.12,dt);d.vy*=Math.pow(.12,dt);if(Math.abs(d.vx)<1)d.vx=0;if(Math.abs(d.vy)<1)d.vy=0;if(pocket(d))continue;walls(d)}for(let i=0;i<discs.length;i++)for(let j=i+1;j<discs.length;j++)if(discs[i].alive&&discs[j].alive)collide(discs[i],discs[j]);if(moving&&allStill()){moving=false;stat.textContent='Taşlar durdu. Yeni atış yapabilirsin.'}}
function circle(x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function draw(aim){ctx.clearRect(0,0,W,W);ctx.fillStyle='#d9a858';ctx.fillRect(0,0,W,W);ctx.fillStyle='#f6d790';ctx.fillRect(margin,margin,play,play);ctx.strokeStyle='#704015';ctx.lineWidth=5;ctx.strokeRect(margin,margin,play,play);ctx.strokeStyle='#9b5c21';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,W/2,79,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(W/2,W/2,52,0,Math.PI*2);ctx.stroke();for(const p of pockets){circle(p.x,p.y,28,'#15100e');circle(p.x,p.y,20,'#040404')}ctx.strokeStyle='#8a4c1b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(margin+72,W-margin-44);ctx.lineTo(W-margin-72,W-margin-44);ctx.stroke();for(const d of discs){if(!d.alive)continue;ctx.save();ctx.shadowColor='#1b0e06';ctx.shadowBlur=8;ctx.shadowOffsetY=4;circle(d.x,d.y,d.r,d.color,d.type==='striker'?'#fff2a7':'#5a3216');ctx.restore();if(d.type==='queen'){ctx.strokeStyle='#ffe5e7';ctx.lineWidth=2;ctx.beginPath();ctx.arc(d.x,d.y,7,0,Math.PI*2);ctx.stroke()}if(d.type==='striker'){ctx.fillStyle='#4d2c0c';ctx.fillRect(d.x-8,d.y-2,16,4)}}if(drag){const s=striker(),p=drag.current,dx=p.x-s.x,dy=p.y-s.y,len=Math.max(1,Math.hypot(dx,dy)),pull=Math.min(210,len),ux=-dx/len,uy=-dy/len;ctx.save();const guide=20+pull*1.38;ctx.strokeStyle='rgba(255,235,139,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+ux*guide,s.y+uy*guide);ctx.stroke();const ax=s.x+ux*guide,ay=s.y+uy*guide;ctx.fillStyle='#ffe57c';ctx.beginPath();ctx.arc(ax,ay,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e8fbff';ctx.font='800 14px Outfit';ctx.textAlign='center';ctx.fillText('GÜÇ '+Math.round(pull/210*100)+'%',s.x,s.y-42);ctx.restore()}else if(allStill()){const s=striker();ctx.save();ctx.strokeStyle='#75e7ff';ctx.lineWidth=2;ctx.setLineDash([5,6]);ctx.beginPath();ctx.arc(s.x,s.y,s.r+12,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#e8fbff';ctx.font='800 12px Outfit';ctx.textAlign='center';ctx.fillText('STRIKER',s.x,s.y-42);ctx.restore()}}
function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;physics(dt);draw(drag);requestAnimationFrame(loop)}
document.querySelector('#reset').onclick=reset;reset();requestAnimationFrame(loop);
</script></body></html>
