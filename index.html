<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>html { zoom: 1.5; }</style>
<script>
  (function(){
    var z = parseInt(localStorage.getItem('vmym_zoom')) || 150;
    var r = (function(){ try{ var d=JSON.parse(localStorage.getItem('vmym_ratio')); if(d&&d.w&&d.h) return d.w+'/'+d.h; }catch(e){} return '7/4'; })();
    var lp=(function(){ try{var d=JSON.parse(localStorage.getItem('vmym_lp'));if(d)return d;}catch(e){}return{width:260,height:900}; })();
    document.write('<style>html{zoom:'+(z/100)+'}.box{aspect-ratio:'+r+'!important}.rp-img{aspect-ratio:'+r+'!important}.game-layout{grid-template-columns:'+lp.width+'px 1fr!important}.left-panel{max-height:'+lp.height+'px!important;height:'+lp.height+'px!important}</style>');
  })();
</script>
<title>Var Mısın? Yok Musun?</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --gold:#f0c040; --red:#e03030; --green:#20c060;
  --bg:#07070f; --surface:#10101a; --surface2:#18182a; --surface3:#1e1e30;
  --border:rgba(240,192,64,0.15); --border2:rgba(240,192,64,0.30);
  --text:#f0ead8; --muted:#6a6680;
  --font-title:'Bebas Neue',sans-serif; --font-body:'Outfit',sans-serif;
}
html,body { min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--font-body); overflow-x:hidden; }
body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:-1;
  background: radial-gradient(ellipse 60% 40% at 20% 10%,rgba(240,192,64,0.04) 0%,transparent 60%),
              radial-gradient(ellipse 40% 60% at 80% 80%,rgba(100,80,200,0.04) 0%,transparent 60%); }
#app { position:relative; z-index:1; }

/* ===== SCREENS ===== */
.screen { display:none; flex-direction:column; min-height:100vh; padding:22px 14px 48px; }
.screen.active { display:flex; animation:fadeIn 0.35s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);} }

/* ===== GAME SCREEN ===== */
#game-screen {
  padding: 16px 20px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}

.game-top {
  text-align: center;
  margin-bottom: 12px;
  width: 100%;
  max-width: 1060px;
}
.game-title { font-family:var(--font-title); font-size:clamp(26px,4vw,44px); letter-spacing:5px; color:var(--gold); line-height:1; text-shadow:0 0 28px rgba(240,192,64,0.28); }
.game-sub { font-family:var(--font-title); font-size:clamp(10px,1.5vw,13px); letter-spacing:6px; color:var(--muted); }

/* 2-column layout: left panel + center */
.game-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 16px;
  width: 100%;
  max-width: 1060px;
  align-items: start;
}

/* ====== LEFT — remaining prices ====== */
.left-panel {
  background: rgba(8,8,18,0.55);
  border: none;
  border-radius: 16px;
  padding: 14px 8px;
  position: sticky;
  top: 0px;
  max-height: calc(100vh - 20px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(6px);
}
.lp-title { font-family:var(--font-title); font-size:13px; letter-spacing:3px; color:var(--muted); margin-bottom:8px; text-align:center; flex-shrink:0; }
.price-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-flow: column;
  grid-template-rows: repeat(10, 1fr);
  gap: 3px;
  overflow-y: auto;
  scrollbar-width: none;
}
.price-list::-webkit-scrollbar { display:none; }

.pl-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 10px;
  border-radius: 6px;
  background: transparent;
  border-left: 2px solid rgba(255,255,255,0.06);
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.pl-item::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(255,255,255,0.02), transparent);
  opacity: 0;
  transition: opacity 0.2s;
}
.pl-item.active-price { border-left-color: rgba(255,255,255,0.15); }
.pl-item.active-price::before { opacity: 1; }
.pl-item.active-price.hi { border-left-color: rgba(32,192,96,0.6); background: rgba(32,192,96,0.04); }
.pl-item.active-price.lo { border-left-color: rgba(224,48,48,0.5); background: rgba(224,48,48,0.04); }
.pl-item.gone { opacity: 0; pointer-events:none; height:0; padding:0; margin:0; border:none; overflow:hidden; }

.pl-dot { display:none; }

.pl-val {
  font-family: var(--font-title);
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.5px;
  line-height: 1;
  transition: color 0.3s;
}
.pl-item.active-price .pl-val { color: rgba(255,255,255,0.85); }
.pl-item.active-price.hi .pl-val { color: var(--green); font-size: 13px; }
.pl-item.active-price.lo .pl-val { color: var(--red); }
.pl-item.gone .pl-val { text-decoration: line-through; color: var(--muted); }

/* ====== CENTER ====== */
.center-panel { display:flex; flex-direction:column; align-items:stretch; width:100%; }

.status-row { display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:8px; min-height:24px; }
.status-msg { font-size:12px; color:var(--muted); }
.status-msg span { color:var(--gold); font-weight:500; }
.open-badge { background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:11px; color:var(--gold); display:none; }
.open-badge.on { display:block; }


/* HEADER IMAGE */
.game-header-img-wrap { width:100%; max-width:900px; margin:0 auto 6px; }
.game-header-img-wrap img { width:100%; height:auto; display:block; object-fit:contain; max-height:180px; }

/* old bar — hidden */
.select-prompt { display:none!important; }

/* ===== SELECT POPUP OVERLAY ===== */
.sel-overlay { position:fixed; inset:0; z-index:999; background:rgba(4,4,10,0.82); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; animation:overlayIn 0.35s ease; }
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
.sel-overlay.hide { animation:overlayOut 0.4s ease forwards; pointer-events:none; }
@keyframes overlayOut{to{opacity:0;}}

.sel-popup { background:var(--surface); border:1px solid var(--border2); border-radius:24px; padding:48px 40px 40px; text-align:center; max-width:420px; width:90%; box-shadow:0 24px 80px rgba(0,0,0,0.7),0 0 60px rgba(240,192,64,0.08); animation:popupIn 0.45s cubic-bezier(0.34,1.56,0.64,1); position:relative; overflow:hidden; }
@keyframes popupIn{from{opacity:0;transform:scale(0.78) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}

.sel-glow { position:absolute; top:-1px; left:50%; transform:translateX(-50%); width:60%; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); border-radius:2px; }

.sel-icon { font-size:56px; display:block; margin-bottom:16px; animation:floatIcon 2.5s ease-in-out infinite; }
@keyframes floatIcon{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

.sel-title { font-family:var(--font-title); font-size:38px; letter-spacing:4px; color:var(--gold); line-height:1; margin-bottom:6px; text-shadow:0 0 30px rgba(240,192,64,0.3); }
.sel-sub { font-size:13px; color:var(--muted); margin-bottom:28px; line-height:1.7; }
.sel-sub strong { color:var(--text); }
.sel-divider { width:48px; height:1px; background:linear-gradient(90deg,transparent,var(--border2),transparent); margin:0 auto 24px; }

.sel-btn { background:var(--gold); color:#07070f; font-family:var(--font-title); font-size:22px; letter-spacing:3px; border:none; border-radius:12px; padding:16px 48px; cursor:pointer; width:100%; box-shadow:0 4px 28px rgba(240,192,64,0.25); transition:opacity 0.15s,transform 0.1s,box-shadow 0.2s; }
.sel-btn:hover { opacity:0.9; box-shadow:0 6px 38px rgba(240,192,64,0.42); }
.sel-btn:active { transform:scale(0.97); }

.sel-particle { position:absolute; width:3px; height:3px; border-radius:50%; background:var(--gold); opacity:0; animation:partFloat linear infinite; }
@keyframes partFloat{0%{transform:translateY(100%) scale(0);opacity:0;}20%{opacity:0.5;}80%{opacity:0.2;}100%{transform:translateY(-30px) scale(2);opacity:0;}}

/* BOX GRID */
.boxes-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; width:100%; margin-bottom:14px; }
.box { aspect-ratio:7/4; background:var(--surface); border:1.5px solid var(--border); border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; user-select:none; gap:2px; }
.box:hover:not(.opened):not(.pbox) { border-color:var(--gold); background:var(--surface2); transform:translateY(-3px) scale(1.03); box-shadow:0 7px 20px rgba(240,192,64,0.12); }
.box.pbox { opacity:0; pointer-events:none; transition:opacity 0.35s ease; }
.box.opened { background:#0c0c12; border-color:rgba(255,255,255,0.06); cursor:default; opacity:0.55; transform:none!important; box-shadow:none!important; }
.box-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:inherit; }
.box-icon { font-size:clamp(14px,3vw,22px); position:relative; }
.box-number { font-family:var(--font-title); font-size:clamp(16px,3.5vw,26px); color:var(--gold); line-height:1; position:relative; }
.box-amt { font-size:clamp(8px,1.4vw,11px); color:var(--muted); position:relative; text-align:center; }
.box-amt.hi { color:var(--green)!important; font-weight:700; }
.box-amt.lo { color:var(--red)!important; }
.box-amt.md { color:#c0a040!important; }

/* OFFER POPUP */
.offer-overlay { position:fixed; inset:0; z-index:990; background:rgba(4,4,10,0.88); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; padding:20px; }
.offer-overlay.on { display:flex; animation:overlayIn 0.3s ease; }
.offer-overlay.hide { animation:overlayOut 0.35s ease forwards; }

.offer-layout { display:flex; gap:16px; align-items:stretch; max-width:900px; width:100%; animation:offerPop 0.5s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes offerPop{from{opacity:0;transform:scale(0.82) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}

/* Left: price list mini panel */
.offer-prices-panel {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px 12px;
  width:220px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  max-height:80vh;
  overflow:hidden;
}
.offer-prices-title { font-family:var(--font-title); font-size:12px; letter-spacing:3px; color:var(--muted); text-align:center; margin-bottom:10px; flex-shrink:0; }
.offer-prices-list { display:grid; grid-template-columns:1fr 1fr; grid-auto-flow:column; grid-template-rows:repeat(10,1fr); gap:3px; overflow-y:auto; flex:1; scrollbar-width:thin; scrollbar-color:rgba(240,192,64,0.1) transparent; }
.opl-item { display:flex; align-items:center; gap:5px; padding:4px 6px; border-radius:6px; background:var(--surface2); }
.opl-item.gone { opacity:0.22; background:transparent; }
.opl-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; background:var(--muted); }
.opl-item.hi .opl-dot { background:var(--green); }
.opl-item.lo .opl-dot { background:var(--red); }
.opl-item.gone .opl-dot { background:rgba(255,255,255,0.1); }
.opl-val { font-family:var(--font-title); font-size:12px; color:var(--text); line-height:1; }
.opl-item.gone .opl-val { text-decoration:line-through; color:var(--muted); }
.opl-item.hi .opl-val { color:var(--green); }
.opl-item.lo .opl-val { color:var(--red); }

/* Right: banker offer card */
.offer-popup {
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:20px;
  padding:20px 24px 20px;
  text-align:center;
  flex:1;
  position:relative;
  overflow:hidden;
  box-shadow:0 28px 80px rgba(0,0,0,0.5), 0 0 50px rgba(240,192,64,0.08);
  display:flex; flex-direction:column; justify-content:center;
}

.offer-top-glow { position:absolute; top:-1px; left:50%; transform:translateX(-50%); width:70%; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }

.offer-phone { font-size:40px; display:block; margin-bottom:10px; animation:phoneRing 0.6s ease infinite alternate; }
@keyframes phoneRing{from{transform:rotate(-12deg);}to{transform:rotate(12deg);}}

.offer-tag { display:none; }
.offer-banker { display:none; }
.offer-amt { font-family:var(--font-title); font-size:clamp(44px,8vw,70px); color:var(--gold); line-height:1; text-shadow:0 0 36px rgba(240,192,64,0.4); margin-bottom:6px; }
.offer-divider { width:48px; height:1px; background:linear-gradient(90deg,transparent,var(--border2),transparent); margin:0 auto 16px; }
.offer-sub { font-size:12px; color:var(--muted); margin-bottom:24px; line-height:1.6; }

.offer-btns { display:flex; gap:12px; }
.btn-deal { flex:1; background:var(--green); color:#07070f; font-family:var(--font-title); font-size:clamp(16px,3vw,22px); letter-spacing:3px; border:none; border-radius:10px; padding:10px; cursor:pointer; transition:opacity 0.15s,transform 0.1s; box-shadow:0 4px 20px rgba(32,192,96,0.25); }
.btn-nodeal { flex:1; background:var(--red); color:#fff; font-family:var(--font-title); font-size:clamp(16px,3vw,22px); letter-spacing:3px; border:none; border-radius:10px; padding:10px; cursor:pointer; transition:opacity 0.15s,transform 0.1s; box-shadow:0 4px 20px rgba(224,48,48,0.25); }
.btn-deal:hover{opacity:0.88;} .btn-nodeal:hover{opacity:0.88;}
.btn-deal:active,.btn-nodeal:active{transform:scale(0.97);}

@media(max-width:640px){
  .offer-layout{flex-direction:column;}
  .offer-prices-panel{width:100%;max-height:200px;}
  .offer-prices-list{grid-template-columns:repeat(4,1fr);grid-auto-flow:row;grid-template-rows:none;}
}

/* ====== RIGHT — player box ====== */
.right-panel { background:var(--surface); border:1px solid var(--border2); border-radius:16px; padding:16px 14px; display:flex; flex-direction:column; align-items:center; gap:10px; position:fixed; right:18px; top:50%; transform:translateY(-50%) translateX(260px); opacity:0; transition:opacity 0.4s ease, transform 0.45s cubic-bezier(0.34,1.2,0.64,1); pointer-events:none; z-index:50; width:200px; box-shadow:0 8px 40px rgba(0,0,0,0.5); }
.right-panel.on { opacity:1; transform:translateY(-50%) translateX(0); pointer-events:auto; }
.rp-label { font-family:var(--font-title); font-size:13px; letter-spacing:3px; color:var(--muted); }
.rp-img { width:100%; aspect-ratio:7/4; border-radius:12px; overflow:hidden; border:2px solid var(--gold); box-shadow:0 0 28px rgba(240,192,64,0.2); background:var(--surface2); display:flex; align-items:center; justify-content:center; animation:rpGlow 2.5s ease-in-out infinite; }
@keyframes rpGlow{0%,100%{box-shadow:0 0 20px rgba(240,192,64,0.18);}50%{box-shadow:0 0 38px rgba(240,192,64,0.38);}}
.rp-img img { width:100%; height:100%; object-fit:cover; display:none; border-radius:inherit; }
.rp-img img.on { display:block; }
.rp-fallback { display:flex; flex-direction:column; align-items:center; gap:4px; }
.rp-icon { font-size:36px; }
.rp-num { font-family:var(--font-title); font-size:48px; color:var(--gold); line-height:1; }
.rp-tag { font-family:var(--font-title); font-size:12px; letter-spacing:2px; color:var(--gold); background:rgba(240,192,64,0.08); border:1px solid var(--border2); border-radius:20px; padding:4px 14px; }

/* ===== RESULT POPUP ===== */
.result-overlay { position:fixed; inset:0; z-index:995; background:rgba(4,4,10,0.88); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; padding:20px; }
.result-overlay.on { display:flex; animation:overlayIn 0.35s ease; }
.result-overlay.hide { animation:overlayOut 0.4s ease forwards; pointer-events:none; }

.result-bg { position:fixed; inset:0; z-index:994; pointer-events:none; }
.confetti-piece { position:absolute; border-radius:2px; animation:cfFall linear infinite; opacity:0; }
@keyframes cfFall{0%{transform:translateY(-20px) rotate(0);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

.result-card { background:var(--surface); border:1px solid var(--border2); border-radius:22px; padding:40px 30px; text-align:center; max-width:460px; width:100%; position:relative; z-index:1; box-shadow:0 24px 70px rgba(0,0,0,0.7), 0 0 60px rgba(240,192,64,0.08); animation:rpop 0.5s cubic-bezier(0.34,1.56,0.64,1); overflow:hidden; }
@keyframes rpop{from{opacity:0;transform:scale(0.78) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
.result-top-glow { position:absolute; top:-1px; left:50%; transform:translateX(-50%); width:65%; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }

.res-emoji { font-size:56px; display:block; margin-bottom:12px; animation:bounce 1s ease infinite; }
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.res-tag { font-family:var(--font-title); font-size:11px; letter-spacing:4px; color:var(--muted); }
.res-dec { font-family:var(--font-title); font-size:clamp(44px,11vw,74px); line-height:1; margin-bottom:4px; }
.res-dec.y { color:var(--green); text-shadow:0 0 26px rgba(32,192,96,0.35); }
.res-dec.n { color:var(--gold); text-shadow:0 0 26px rgba(240,192,64,0.35); }
.res-won { font-family:var(--font-title); font-size:clamp(30px,7vw,50px); color:var(--text); margin-bottom:16px; }
.res-div { width:50px; height:1px; background:var(--border2); margin:0 auto 16px; }
.res-cmp { background:var(--surface2); border-radius:10px; padding:12px; margin-bottom:22px; text-align:left; }
.cr { display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-size:13px; }
.cr+.cr { border-top:1px solid rgba(255,255,255,0.05); }
.cl { color:var(--muted); } .cv { font-weight:600; }
.cv.g{color:var(--green);} .cv.gold{color:var(--gold);} .cv.r{color:var(--red);}
.btn-restart { background:var(--gold); color:#07070f; font-family:var(--font-title); font-size:20px; letter-spacing:3px; border:none; border-radius:11px; padding:14px 48px; cursor:pointer; width:100%; transition:opacity 0.15s,box-shadow 0.2s; box-shadow:0 4px 20px rgba(240,192,64,0.22); }
.btn-restart:hover { opacity:0.88; }

/* Responsive */
@media(max-width:900px){
  .game-layout { grid-template-columns:200px 1fr; gap:12px; }
  .pl-val { font-size:12px; }
  .right-panel { width:150px; right:8px; }
}
@media(max-width:640px){
  .game-layout { grid-template-columns:1fr; }
  .left-panel { position:static; max-height:none; }
  .price-list { grid-template-columns:repeat(3,1fr); }
  .right-panel { width:110px; right:6px; }
  .boxes-grid { grid-template-columns:repeat(3,1fr); }
}
</style>
</head>
<body>
<div id="app">

<!-- ===== GAME ===== -->
<div id="game-screen" class="screen active">
  <div class="game-top">
    <div class="game-header-img-wrap" id="game-header-img-wrap" style="display:none;">
      <img id="game-header-img" src="" alt="Başlık">
    </div>
    <div class="game-header-text" id="game-header-text">
      <div class="game-title">VAR MISIN? YOK MUSUN?</div>
      <div class="game-sub">YOK MUSUN?</div>
    </div>
  </div>

  <div class="game-layout">

    <!-- LEFT: remaining prices -->
    <div class="left-panel">
      <div class="lp-title">KALAN TUTARLAR</div>
      <div class="price-list" id="price-list"></div>
    </div>

    <!-- CENTER: boxes + offer -->
    <div class="center-panel">

      <div class="boxes-grid" id="boxes-grid"></div>

    </div>

  </div>

  <!-- RIGHT: fixed player box panel -->
  <div class="right-panel" id="right-panel">
    <div class="rp-label">SENİN KUTUN</div>
    <div class="rp-img" id="rp-img">
      <img id="rp-img-el" src="" alt="">
      <div class="rp-fallback" id="rp-fallback">
        <div class="rp-icon">⭐</div>
        <div class="rp-num" id="rp-num">?</div>
      </div>
    </div>
    <div class="rp-tag" id="rp-tag">KUTU #?</div>
  </div>

</div>

<!-- ===== RESULT POPUP ===== -->
<div class="result-bg" id="confetti-bg"></div>
<div class="result-overlay" id="result-overlay">
  <div class="result-card">
    <div class="result-top-glow"></div>
    <span class="res-emoji" id="res-emoji">🎉</span>
    <div class="res-tag" id="res-tag">OYUN SONUCU</div>
    <div class="res-dec" id="res-dec">VAR!</div>
    <div class="res-won" id="res-won">₺0</div>
    <div class="res-div"></div>
    <div class="res-cmp" id="res-cmp"></div>
    <button class="btn-restart" onclick="restartGame()">🔄 YENİ OYUN</button>
  </div>
</div>


<!-- ===== OFFER POPUP ===== -->
<div class="offer-overlay" id="offer-overlay">
  <div class="offer-layout">

    <!-- Left: remaining prices -->
    <div class="offer-prices-panel">
      <div class="offer-prices-title">KALAN TUTARLAR</div>
      <div class="offer-prices-list" id="offer-prices-list"></div>
    </div>

    <!-- Right: banker offer -->
    <div class="offer-popup">
      <div class="offer-top-glow"></div>
      <span class="offer-phone">📞</span>
      <div class="offer-amt" id="offer-amt">₺0</div>
      <div class="offer-divider"></div>
      <div class="offer-sub" id="offer-sub">Bu teklifi kabul ediyor musunuz?</div>
      <div class="offer-btns">
        <button class="btn-deal" onclick="acceptDeal()">✓ VAR!</button>
        <button class="btn-nodeal" onclick="rejectDeal()">✗ YOK!</button>
      </div>
    </div>

  </div>
</div>

<!-- ===== SELECT POPUP ===== -->
<div class="sel-overlay" id="sel-overlay">
  <div class="sel-popup">
    <div class="sel-glow"></div>
    <span class="sel-icon">🎁</span>
    <div class="sel-title">KUTUNUZU SEÇİN</div>
    <div class="sel-divider"></div>
    <div class="sel-sub">
      <strong>20 kutu</strong> arasından birini seçin.<br>
      İçinde ne olduğunu sadece siz bileceksiniz.<br>
      Banker'ı yenebilecek misiniz?
    </div>
    <button class="sel-btn" onclick="closeSelectPopup()">🎯 KUTUMU SEÇECEĞİM</button>
  </div>
</div>

</div>
<script>
const SK_PRICES = 'vmym_prices';
const DEFAULT_PRICES = [100,250,500,1000,2500,5000,10000,20000,50000,100000,150000,200000,300000,400000,500000,600000,750000,900000,1000000,2000000];
const OPEN_SCHEDULE  = [5,4,3,2,1,1,1,1,1];

/* ===== IndexedDB helpers ===== */
const IDB_NAME='vmym_db', IDB_STORE='assets', IDB_VER=1;
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(IDB_NAME,IDB_VER);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess=e=>res(e.target.result);
    req.onerror=e=>rej(e.target.error);
  });
}
function idbGet(key){
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const req=tx.objectStore(IDB_STORE).get(key);
    req.onsuccess=e=>res(e.target.result||null);
    req.onerror=e=>rej(e.target.error);
  }));
}

function loadPrices(){ try{ const d=JSON.parse(localStorage.getItem(SK_PRICES)); if(Array.isArray(d)&&d.length===20)return d; }catch(e){} return[...DEFAULT_PRICES]; }

let rawPrices = loadPrices();
let boxImages = new Array(20).fill(null); // object URLs, loaded async

// Game state
let prices=[], shuffleMap=[], playerBox=null, openedBoxes=new Set();
let gameState='select', openCount=0, openTarget=OPEN_SCHEDULE[0], roundNumber=0, currentOffer=0;

function fmt(n){ return '₺'+Math.round(n).toLocaleString('tr-TR'); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function setStatus(h){}

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; } return a; }


/* ===== HEADER IMAGE ===== */
async function applyHeaderImg(){
  try {
    const blob = await idbGet('header_img');
    const wrap = document.getElementById('game-header-img-wrap');
    const txt  = document.getElementById('game-header-text');
    const img  = document.getElementById('game-header-img');
    if(blob){
      if(img._objUrl) URL.revokeObjectURL(img._objUrl);
      const url = URL.createObjectURL(blob);
      img._objUrl = url;
      img.src = url;
      wrap.style.display = 'block';
      txt.style.display  = 'none';
    } else {
      wrap.style.display = 'none';
      txt.style.display  = '';
    }
  } catch(e){
    document.getElementById('game-header-img-wrap').style.display='none';
    document.getElementById('game-header-text').style.display='';
  }
}

/* ===== SELECT POPUP ===== */
function showSelectPopup(){
  const ov = document.getElementById('sel-overlay');
  if(!ov) return;
  // spawn particles
  ov.querySelector('.sel-popup').querySelectorAll('.sel-particle').forEach(p=>p.remove());
  for(let i=0;i<12;i++){
    const p=document.createElement('div');
    p.className='sel-particle';
    p.style.cssText=`left:${Math.random()*100}%;bottom:0;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s;width:${2+Math.random()*4}px;height:${2+Math.random()*4}px;`;
    ov.querySelector('.sel-popup').appendChild(p);
  }
  ov.classList.remove('hide');
  ov.style.display='flex';
}
function closeSelectPopup(){
  const ov=document.getElementById('sel-overlay');
  ov.classList.add('hide');
  setTimeout(()=>{ ov.style.display='none'; }, 400);
}


/* ===== BACKGROUND ===== */
async function applyBackground(){
  // Remove old bg layer
  const old = document.getElementById('bg-layer');
  if(old) old.remove();

  try {
    const raw = localStorage.getItem('vmym_bg');
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || d.mode === 'none') return;

    const layer = document.createElement('div');
    layer.id = 'bg-layer';
    layer.style.cssText = 'position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity 0.5s;';

    if(d.mode === 'color'){
      layer.style.background = d.color || '#07070f';
      layer.style.opacity = '1';
      document.body.appendChild(layer);
      document.body.style.background = 'transparent';
    } else if(d.mode === 'image'){
      const blob = await idbGet('bg_img');
      if(!blob) return;
      const url = URL.createObjectURL(blob);
      const fitMap = {
        cover:   'center/cover no-repeat fixed',
        contain: 'center/contain no-repeat fixed',
        repeat:  'top left repeat fixed',
        center:  'center/auto no-repeat fixed'
      };
      layer.style.background = `url('${url}') ${fitMap[d.fit]||fitMap.cover}`;
      layer.style.opacity = ((d.opacity||100)/100).toString();
      document.body.appendChild(layer);
      document.body.style.background = 'transparent';
    }
  } catch(e){ console.warn('applyBackground error',e); }
}


/* ===== LEFT PANEL IMAGE (header only) ===== */
async function applyLpImage(){
  try {
    const blob = await idbGet('lp_img');
    const titleEl = document.querySelector('.lp-title');
    const existingImg = document.getElementById('lp-header-img');
    if(existingImg) existingImg.remove();

    if(blob){
      const url = URL.createObjectURL(blob);
      const img = document.createElement('img');
      img.id = 'lp-header-img';
      img.src = url;
      img.style.cssText = 'width:100%;display:block;object-fit:contain;border-radius:6px;margin-bottom:8px;flex-shrink:0;';
      const lp = document.querySelector('.left-panel');
      if(lp) lp.insertBefore(img, lp.firstChild);
      // Hide text title since image replaces it
      if(titleEl) titleEl.style.display = 'none';
    } else {
      if(titleEl) titleEl.style.display = '';
    }
  } catch(e){ console.warn('applyLpImage error', e); }
}

/* ===== INIT GAME ===== */
async function initGame(){
  rawPrices = loadPrices();

  // Revoke previous object URLs
  boxImages.forEach(u=>{ if(u) try{URL.revokeObjectURL(u);}catch(e){} });
  boxImages = new Array(20).fill(null);

  // Load all box images from IndexedDB in parallel
  const blobs = await Promise.all(
    Array.from({length:20},(_,i)=>idbGet('box_'+i).catch(()=>null))
  );
  boxImages = blobs.map(b=>b?URL.createObjectURL(b):null);

  const adminOrder = Array.from({length:20},(_,i)=>i);
  shuffleMap = shuffle(adminOrder);
  prices = shuffleMap.map(ai=>rawPrices[ai]);
  playerBox=null; openedBoxes=new Set(); gameState='select';
  openCount=0; roundNumber=0; openTarget=OPEN_SCHEDULE[0]; currentOffer=0;
  applyHeaderImg();
  applyBackground();
  applyLpImage();
  buildGame();
  buildPriceList();
  setTimeout(showSelectPopup, 600);
}

function buildGame(){
  const g=document.getElementById('boxes-grid'); g.innerHTML='';
  const offerOv=document.getElementById('offer-overlay');
  if(offerOv){ offerOv.classList.remove('on','hide'); }
  const ob=document.getElementById('open-badge');
  if(ob) ob.classList.remove('on');
  const rp=document.getElementById('right-panel');
  if(rp) rp.classList.remove('on');

  for(let i=0;i<20;i++){
    const d=document.createElement('div');
    d.className='box'; d.id='box'+i;
    d.style.opacity='0'; d.style.transform='scale(0.6) rotate(-8deg)'; d.style.transition='none';
    const adminIdx=shuffleMap[i];
    const src=boxImages[adminIdx];
    if(src){
      d.innerHTML=`<img class="box-img" src="${src}" alt="">`;
    } else {
      d.innerHTML=`<div class="box-icon">🎁</div><div class="box-number">${i+1}</div><div class="box-amt"></div>`;
    }
    d.onclick=()=>clickBox(i);
    g.appendChild(d);
    setTimeout(()=>{
      d.style.transition='opacity 0.3s ease,transform 0.35s cubic-bezier(0.34,1.56,0.64,1)';
      d.style.opacity='1'; d.style.transform='scale(1) rotate(0deg)';
    }, i*50);
  }
}

/* ===== PRICE LIST ===== */
function buildPriceList(){
  const list=document.getElementById('price-list');
  const sorted=[...prices].sort((a,b)=>a-b); // ascending: small→big, grid fills col by col
  const maxP=Math.max(...prices), minP=Math.min(...prices);
  // track index mapping for duplicates
  const usedMap=new Map();
  list.innerHTML='';
  sorted.forEach(p=>{
    const key=p;
    const used=usedMap.get(key)||new Set();
    // find origIdx
    let origIdx=-1;
    for(let i=0;i<prices.length;i++){
      if(prices[i]===p&&!used.has(i)){ origIdx=i; break; }
    }
    used.add(origIdx); usedMap.set(key,used);

    const isGone=openedBoxes.has(origIdx);
    let hi='', cls='pl-item';
    if(!isGone){
      cls+=' active-price';
      if(p>=maxP*0.5) { cls+=' hi'; hi='hi'; }
      else if(p<=minP*5) { cls+=' lo'; hi='lo'; }
    } else {
      cls+=' gone';
    }
    const row=document.createElement('div');
    row.className=cls; row.id='pl-'+origIdx;
    row.innerHTML=`<div class="pl-dot"></div><div class="pl-val">${fmt(p)}</div>`;
    list.appendChild(row);
  });
}

function markPriceGone(idx){
  const el=document.getElementById('pl-'+idx);
  if(el){ el.className='pl-item gone'; }
}

/* ===== CLICK BOX ===== */
function clickBox(idx){
  if(openedBoxes.has(idx)) return;

  if(gameState==='select'){
    playerBox=idx; gameState='open';
    // Fade box out from grid
    const el=document.getElementById('box'+idx);
    el.style.transition='opacity 0.35s ease,transform 0.35s ease';
    el.style.opacity='0'; el.style.transform='scale(0.7)';
    setTimeout(()=>el.classList.add('pbox'),350);

    // Show right panel
    const adminIdx=shuffleMap[idx];
    const src=boxImages[adminIdx];
    const rpImg=document.getElementById('rp-img-el');
    const rpFb=document.getElementById('rp-fallback');
    document.getElementById('rp-num').textContent=idx+1;
    document.getElementById('rp-tag').textContent='KUTU #'+(idx+1);
    if(src){ rpImg.src=src; rpImg.classList.add('on'); rpFb.style.display='none'; }
    else { rpImg.src=''; rpImg.classList.remove('on'); rpFb.style.display=''; }
    setTimeout(()=>document.getElementById('right-panel').classList.add('on'),200);

    // select-prompt removed
    updateBadge();
    setStatus(`Kutu ${idx+1} sizin! <span>${openTarget} kutu</span> açın.`);
    return;
  }

  if(gameState!=='open') return;
  if(idx===playerBox){ setStatus('⚠️ Bu sizin kutunuz!'); return; }

  openedBoxes.add(idx);
  const amt=prices[idx];
  const maxP=Math.max(...prices), minP=Math.min(...prices);
  let cls='md';
  if(amt>=maxP*0.5) cls='hi';
  else if(amt<=minP*5) cls='lo';

  const el=document.getElementById('box'+idx);
  el.classList.add('opened');
  const adminIdx=shuffleMap[idx];
  const src=boxImages[adminIdx];
  if(src){
    el.innerHTML=`<img class="box-img" src="${src}" alt="" style="opacity:0.22"><div class="box-amt ${cls}" style="font-size:22px;font-weight:700;z-index:2;text-shadow:0 0 10px #000,0 0 6px #000,0 0 3px #000;">${fmt(amt)}</div>`;
  } else {
    const icon=amt>=500000?'💰':amt>=100000?'💵':amt>=10000?'💳':'💸';
    el.innerHTML=`<div class="box-icon">${icon}</div><div class="box-number">${idx+1}</div><div class="box-amt ${cls}">${fmt(amt)}</div>`;
  }

  markPriceGone(idx);
  openCount++;
  updateBadge();

  const remaining=20-openedBoxes.size-1;
  if(openCount>=openTarget){
    if(remaining<=0){ endGame(false); return; }
    gameState='offer';
    setTimeout(showOffer,400);
  } else {
    setStatus(`<span>${openTarget-openCount}</span> kutu daha açın.`);
  }
}

function updateBadge(){
  const b=document.getElementById('open-badge');
  if(!b) return;
  if(gameState==='open'&&openTarget-openCount>0){ b.textContent=`Kalan: ${openTarget-openCount}`; b.classList.add('on'); }
  else b.classList.remove('on');
}

function calcOffer(){
  const rem=[];
  prices.forEach((p,i)=>{ if(!openedBoxes.has(i)&&i!==playerBox) rem.push(p); });
  rem.push(prices[playerBox]);
  const avg=rem.reduce((a,b)=>a+b,0)/rem.length;
  return Math.round(avg*(0.20+(openedBoxes.size/19)*0.60));
}

function buildOfferPriceList(){
  const list=document.getElementById('offer-prices-list');
  if(!list) return;
  const sorted=[...prices].sort((a,b)=>a-b);
  const maxP=Math.max(...prices), minP=Math.min(...prices);
  const usedMap=new Map();
  list.innerHTML='';
  sorted.forEach(p=>{
    const used=usedMap.get(p)||new Set();
    let origIdx=-1;
    for(let i=0;i<prices.length;i++){ if(prices[i]===p&&!used.has(i)){origIdx=i;break;} }
    used.add(origIdx); usedMap.set(p,used);
    const isGone=openedBoxes.has(origIdx);
    let cls='opl-item';
    if(isGone) cls+=' gone';
    else if(p>=maxP*0.5) cls+=' hi';
    else if(p<=minP*5) cls+=' lo';
    const row=document.createElement('div');
    row.className=cls;
    row.innerHTML=`<div class="opl-dot"></div><div class="opl-val">${fmt(p)}</div>`;
    list.appendChild(row);
  });
}

async function applyBankerImg(){
  try {
    const blob = await idbGet('banker_img');
    const phoneEl = document.querySelector('.offer-phone');
    const tagEl = document.querySelector('.offer-tag');
    const old = document.getElementById('banker-img-popup');
    if(old) old.remove();
    if(blob){
      const url = URL.createObjectURL(blob);
      const img = document.createElement('img');
      img.id = 'banker-img-popup';
      img.src = url;
      img.style.cssText = 'max-width:100%;max-height:180px;object-fit:contain;border-radius:10px;margin-bottom:12px;display:block;margin-left:auto;margin-right:auto;';
      if(phoneEl){ phoneEl.style.display='none'; phoneEl.parentNode.insertBefore(img, phoneEl); }
      if(tagEl) tagEl.style.marginTop='0';
    } else {
      if(phoneEl) phoneEl.style.display='';
    }
  } catch(e){}
}

function showOffer(){
  currentOffer=calcOffer();
  const remaining=20-openedBoxes.size-1;
  document.getElementById('offer-amt').textContent=fmt(currentOffer);
  document.getElementById('offer-sub').textContent=`${remaining} kutu kaldı. Teklifi kabul ediyor musunuz?`;
  buildOfferPriceList();
  applyBankerImg();
  const ov=document.getElementById('offer-overlay');
  ov.classList.remove('hide');
  ov.classList.add('on');
  setStatus('📞 Banker arıyor...');
  const ob=document.getElementById('open-badge');if(ob)ob.classList.remove('on');
}

function acceptDeal(){
  const ov=document.getElementById('offer-overlay');
  ov.classList.add('hide');
  setTimeout(()=>{ ov.classList.remove('on','hide'); endGame(true); }, 350);
}
function rejectDeal(){
  const ov=document.getElementById('offer-overlay');
  ov.classList.add('hide');
  roundNumber++; openCount=0;
  const remaining=20-openedBoxes.size-1;
  setTimeout(()=>{
    ov.classList.remove('on','hide');
    if(remaining<=0){ endGame(false); return; }
    openTarget=Math.min(OPEN_SCHEDULE[roundNumber]||1,remaining);
    gameState='open';
    updateBadge();
    setStatus(`Yok! <span>${openTarget}</span> kutu daha açın.`);
  }, 350);
}

function endGame(deal){
  const playerAmt=prices[playerBox];
  const ov=document.getElementById('result-overlay');
  ov.classList.remove('hide');
  ov.classList.add('on');
  if(deal){
    document.getElementById('res-emoji').textContent='🤝';
    document.getElementById('res-tag').textContent='ANLAŞMA YAPILDI';
    const d=document.getElementById('res-dec'); d.textContent='VAR!'; d.className='res-dec y';
    document.getElementById('res-won').textContent=fmt(currentOffer);
    const diff=playerAmt-currentOffer;
    document.getElementById('res-cmp').innerHTML=`
      <div class="cr"><span class="cl">Kazandığınız</span><span class="cv g">${fmt(currentOffer)}</span></div>
      <div class="cr"><span class="cl">Kutunuzdaki</span><span class="cv gold">${fmt(playerAmt)}</span></div>
      <div class="cr"><span class="cl">Fark</span><span class="cv ${diff>0?'r':'g'}">${diff>0?'-':'+'} ${fmt(Math.abs(diff))}</span></div>
      <div class="cr"><span class="cl">Yorum</span><span class="cv" style="font-size:11px">${diff>0?'Kutunuz daha değerliydi 😢':'Harika karar! 🎊'}</span></div>`;
    spawnConfetti();
  } else {
    document.getElementById('res-emoji').textContent='📦';
    document.getElementById('res-tag').textContent='KUTUNUZ AÇILDI';
    const d=document.getElementById('res-dec'); d.textContent='YOK!'; d.className='res-dec n';
    document.getElementById('res-won').textContent=fmt(playerAmt);
    document.getElementById('res-cmp').innerHTML=`
      <div class="cr"><span class="cl">Son Banker Teklifi</span><span class="cv gold">${fmt(currentOffer||0)}</span></div>
      <div class="cr"><span class="cl">Kutunuzdaki</span><span class="cv ${playerAmt>=(currentOffer||0)?'g':'r'}">${fmt(playerAmt)}</span></div>
      <div class="cr"><span class="cl">Karar</span><span class="cv" style="font-size:11px">${playerAmt>=(currentOffer||0)?'Doğru seçim! 🎉':'Teklife gitmeliydiniz 😅'}</span></div>`;
    if(playerAmt>100000) spawnConfetti();
  }
}

function spawnConfetti(){
  const bg=document.getElementById('confetti-bg'); bg.innerHTML='';
  const cols=['#f0c040','#20c060','#e03030','#4080ff','#ff80c0','#80ffff'];
  for(let i=0;i<64;i++){
    const c=document.createElement('div'); c.className='confetti-piece';
    c.style.cssText=`left:${Math.random()*100}%;width:${4+Math.random()*8}px;height:${4+Math.random()*8}px;background:${cols[Math.floor(Math.random()*cols.length)]};animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*2}s;border-radius:${Math.random()>.5?'50%':'2px'};opacity:0;`;
    bg.appendChild(c);
  }
}

function restartGame(){
  document.getElementById('confetti-bg').innerHTML='';
  const ov=document.getElementById('result-overlay');
  ov.classList.add('hide');
  setTimeout(()=>{ ov.classList.remove('on','hide'); initGame(); }, 400);
}

// START
initGame();
</script>
</body>
</html>
