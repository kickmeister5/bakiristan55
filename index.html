<html lang="tr">
<head>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#f0c040;--bg:#07070f;--surface:#10101a;--surface2:#18182a;
  --border:rgba(240,192,64,0.15);--border2:rgba(240,192,64,0.3);
  --text:#f0ead8;--muted:#6a6680;
  --font-title:'Bebas Neue',sans-serif;--font-body:'Outfit',sans-serif;
  --card-min-w:150px;--card-banner-h:150px;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow-x:hidden;}
html.fidget-hidden .fidget-slot{display:none!important;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-2;
  background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(240,192,64,0.04) 0%,transparent 60%),
             radial-gradient(ellipse 40% 60% at 80% 80%,rgba(100,80,200,0.04) 0%,transparent 60%);}
#bg-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;transition:opacity 0.5s;}

#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 60px;}

/* HEADER IMAGE */
.site-header{width:100%;display:none;flex-shrink:0;justify-content:center;}
.site-header.on{display:flex;}
.site-header img{width:100%;height:auto;display:block;object-fit:contain;margin-inline:auto;}

/* GAMES GRID */
.games-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;width:100%;max-width:1280px;
  padding:40px 20px 0;
}

/* 1080p tasarımını temel al: daha yüksek çözünürlükte fiziksel görünüm küçülmesin. */
@media (min-width:2200px) and (max-width:3499px){
  .games-grid{grid-template-columns:repeat(4,390px);width:max-content;max-width:calc(100% - 40px);gap:27px;padding-top:53px;}
  .gc-banner{height:280px!important;}
  .site-credit-tag{scale:1.33;transform-origin:right center;}
  .fidget-slot{scale:1.33;transform-origin:right bottom;}
}
@media (min-width:3500px){
  .games-grid{grid-template-columns:repeat(4,586px);width:max-content;max-width:calc(100% - 60px);gap:40px;padding-top:80px;}
  .gc-banner{height:420px!important;}
  .site-credit-tag{scale:2;transform-origin:right center;}
  .fidget-slot{scale:2;transform-origin:right bottom;}
}
@media (max-width:980px){
  .games-grid{grid-template-columns:repeat(2,1fr);max-width:700px;}
}
@media (max-width:520px){
  .games-grid{grid-template-columns:1fr;max-width:420px;}
}

/* GAME CARD — sadece banner */
.game-card{
  border-radius:14px;overflow:visible;cursor:pointer;
  transition:transform 0.22s cubic-bezier(0.16,1,0.3,1),box-shadow 0.22s ease,border-color 0.22s ease;
  text-decoration:none;display:block;position:relative;
  border:1px solid rgba(255,255,255,0.08);transform-style:preserve-3d;
  will-change:transform;
}
.game-card::before{content:'';position:absolute;inset:-1px;z-index:6;pointer-events:none;
  opacity:0;border-radius:inherit;transition:opacity .22s ease;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.52) 48%,rgba(240,192,64,.3) 54%,transparent 70%);
  transform:translateX(-125%);clip-path:inset(0 round 14px);}
.game-card::after{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;
  background:radial-gradient(circle at var(--glow-x,50%) var(--glow-y,50%),rgba(255,255,255,.32),transparent 32%);
  mix-blend-mode:screen;transition:opacity .18s ease;border-radius:inherit;}
.game-card:hover{box-shadow:0 24px 55px rgba(0,0,0,.58),0 0 30px rgba(240,192,64,.18);border-color:rgba(240,192,64,.65);z-index:2;}
.game-card:hover::before{opacity:0;animation:none;}
.game-card:hover::after{opacity:1;}
@keyframes cardSheen{to{transform:translateX(125%);}}
.game-card.inactive{display:none;cursor:default;pointer-events:none;}
.coin-drop-badge{position:absolute;right:-15px;bottom:-15px;z-index:12;width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 5px 9px rgba(0,0,0,.72));pointer-events:none;}

/* BANNER */
.gc-banner{
  width:100%;height:var(--card-banner-h,300px);
  position:relative;overflow:hidden;display:block;border-radius:inherit;
  background:#0a0a14;
}
.gc-banner img.gc-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
.gc-banner img.gc-bg.on{display:block;}
.gc-banner-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;filter:drop-shadow(0 4px 24px rgba(0,0,0,0.6));animation:floatIcon 3s ease-in-out infinite;}
@keyframes floatIcon{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.gc-banner img.gc-bg.on ~ .gc-banner-icon{display:none;}

/* INACTIVE OVERLAY */
.gc-inactive-overlay{
  position:absolute;inset:0;z-index:5;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.55);
}
.game-card.inactive .gc-inactive-overlay{display:flex;}
.gc-inactive-img{max-width:70%;max-height:70%;object-fit:contain;display:none;}
.gc-inactive-img.on{display:block;}
.gc-inactive-default{font-family:var(--font-title);font-size:clamp(16px,3vw,26px);letter-spacing:3px;color:rgba(255,255,255,0.7);}
.site-credit-tag{position:fixed;right:18px;top:50%;translate:0 -50%;z-index:50;width:220px;height:220px;padding:20px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(9,12,18,.78);box-shadow:0 12px 32px rgba(0,0,0,.3);backdrop-filter:blur(9px);color:rgba(255,255,255,.76);font-size:15px;line-height:1.55;letter-spacing:.08px;display:grid;place-items:center;text-align:center}.site-credit-tag a{color:#fff;text-decoration:none;white-space:nowrap}.youtube-mark{display:inline-flex;vertical-align:-2px;margin-left:3px}.youtube-mark svg{width:19px;height:14px;display:block}.site-credit-tag a:hover{color:#ff5b5b;text-decoration:underline}.site-credit-tag strong{color:inherit;font-weight:800}@media(max-width:700px){.site-credit-tag{width:185px;height:185px;font-size:13px;padding:16px}}.snowfall{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.72;mix-blend-mode:screen;background-image:radial-gradient(circle at 20px 22px,rgba(255,255,255,.95) 0 1.5px,transparent 2.1px),radial-gradient(circle at 87px 74px,rgba(220,242,255,.82) 0 1px,transparent 1.7px),radial-gradient(circle at 146px 35px,rgba(255,255,255,.78) 0 1.2px,transparent 1.9px),radial-gradient(circle at 44px 132px,rgba(232,247,255,.72) 0 1px,transparent 1.8px);background-size:180px 180px,230px 230px,270px 270px,320px 320px;animation:cssSnowfall 13s linear infinite}@keyframes cssSnowfall{from{background-position:0 0,0 0,0 0,0 0}to{background-position:16px 360px,-12px 460px,18px 560px,-8px 680px}}.site-credit-tag{z-index:50}</style>

.homepage-audio-control{position:fixed;left:20px;bottom:20px;z-index:80;display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #ffffff2e;border-radius:999px;background:#080b11d9;box-shadow:0 10px 28px #0008;backdrop-filter:blur(12px);color:#fff}.homepage-audio-control:hover{background:#121826ed}.homepage-audio-toggle{display:grid;place-items:center;width:30px;height:30px;padding:0;border:1px solid #f4c542aa;border-radius:50%;background:#f4c542;color:#15110a;font:bold 18px/1 Arial;cursor:pointer;transition:transform .18s ease}.homepage-audio-toggle:hover{transform:scale(1.08)}.homepage-audio-toggle.playing{background:#fff1ad}.homepage-audio-toggle.muted{background:#2a303a;border-color:#7f8997;color:#c5cbd5}.homepage-audio-volume{display:flex;align-items:center;gap:7px;max-width:0;overflow:hidden;opacity:0;transition:max-width .24s ease,opacity .2s ease}.homepage-audio-control:hover .homepage-audio-volume,.homepage-audio-control:focus-within .homepage-audio-volume{max-width:150px;opacity:1}.homepage-audio-volume input{width:95px;accent-color:#f4c542;cursor:pointer}.homepage-audio-volume span{min-width:31px;font:700 11px Arial;color:#f4c542}@media(max-width:700px){.homepage-audio-control{left:12px;bottom:12px}.homepage-audio-volume{max-width:126px;opacity:1}.homepage-audio-volume input{width:76px}}

<script>
const BIN_ID  = '6a2a8f27f5f4af5e29de21ee';
const BIN_KEY = '$2a$10$jmvujdFyJ.mML6da40FEleAhD1/oz/xVD612cQ6NAxRM4oQedpnBi';

function clGet(key){
  try{ return (JSON.parse(localStorage.getItem('vmym_cl_urls'))||{})[key]||null; }catch(e){ return null; }
}

/* Cloudinary görsellerini otomatik olarak sıkıştırılmış/uygun formatta (webp/avif) ve sayfada gerçekten kullanılan boyutta servis eder — indirme boyutunu ciddi oranda küçültür */
function clOpt(url, width){
  if(!url) return url;
  if(url.indexOf('res.cloudinary.com')===-1 || url.indexOf('/upload/')===-1) return url;
  const t = 'f_auto,q_auto'+(width?',w_'+width:'');
  return url.replace('/upload/', '/upload/'+t+'/');
}

/* Henüz gerçek bir oyunu olmayan kartlar için varsayılan durum: kapalı.
   Admin panelinden elle "AKTİF" yapılmadığı sürece bu kartlar tıklanamaz/çıkmaz-sokak olmaz. */
/* Henüz gerçek bir oyunu olmayan kartlar için varsayılan durum: kapalı.
   Admin panelinden elle "AKTİF" yapılmadığı sürece bu kartlar tıklanamaz/çıkmaz-sokak olmaz. */
const DEFAULT_INACTIVE_GAMES = ['game3'];

async function syncConfig(){
  try{
    const res = await fetch('https://api.jsonbin.io/v3/b/'+BIN_ID+'/latest',{headers:{'X-Master-Key':BIN_KEY}});
    if(!res.ok) return;
    const rec = (await res.json()).record||{};
    ['hp_bg','hp_card_w','hp_card_h','hp_cards','hp_fidget','hp_header','vmym_cl_urls'].forEach(k=>{
      if(rec[k]!==undefined) localStorage.setItem(k, typeof rec[k]==='string'?rec[k]:JSON.stringify(rec[k]));
    });
  }catch(e){}
}

function applySettings(){
  /* 1 — arkaplan */
  try{
    const bg = JSON.parse(localStorage.getItem('hp_bg')||'{}');
    const layer = document.getElementById('bg-layer');
    if(bg.mode==='color'){
      layer.style.background = bg.color||'#07070f';
      document.body.style.background='transparent';
    } else if(bg.mode==='image'){
      const url = clOpt(clGet('hp_bg_img'), 1600);
      if(url){
        const fit={cover:'center/cover no-repeat fixed',contain:'center/contain no-repeat fixed',repeat:'top left repeat fixed',center:'center/auto no-repeat fixed'};
        layer.style.background = "url('"+url+"') "+(fit[bg.fit]||fit.cover);
        layer.style.opacity = ((bg.opacity||100)/100).toString();
        document.body.style.background='transparent';
      }
    }
  }catch(e){}

  /* 2 — header görseli */
  try{
    const hdr = JSON.parse(localStorage.getItem('hp_header')||'{}');
    const wrap = document.getElementById('site-header');
    const img  = document.getElementById('site-header-img');
    const url  = clOpt(clGet('hp_header_img'), 1200);
    if(url && hdr.show!==false){
      img.src=url; wrap.classList.add('on');
      if(hdr.maxW){
        const displayScale=Math.max(1,Math.min(2,window.innerWidth/1920));
        img.style.maxWidth=Math.round(hdr.maxW*displayScale)+'px';
      }
    } else {
      wrap.classList.remove('on');
    }
  }catch(e){}

  /* 3 — kart boyutları */
  try{
    const w = JSON.parse(localStorage.getItem('hp_card_w')||'150');
    const h = JSON.parse(localStorage.getItem('hp_card_h')||'150');
    document.documentElement.style.setProperty('--card-min-w',w+'px');
    document.documentElement.style.setProperty('--card-banner-h',h+'px');
  }catch(e){}

  /* 4 — kart görselleri + aktiflik + deaktif etiketi */
  try{
    const fidget=JSON.parse(localStorage.getItem('hp_fidget')||'{"enabled":true}');
    document.documentElement.classList.toggle('fidget-hidden',fidget.enabled===false);
  }catch(e){}

  try{
    const cards = JSON.parse(localStorage.getItem('hp_cards')||'{}');
    ['vmym','faul','game3','game4','isimsehir','katmaner','yayincitabusu','balonzinciri','cumleavi','cekilis'].forEach(key=>{
      const cfg = cards[key]||{};

      /* Fındık Coin ödül rozeti */
      const dropCard = document.getElementById('card-'+key);
      if(dropCard){
        const existingDrop = dropCard.querySelector('.coin-drop-badge');
        if(existingDrop) existingDrop.remove();
        if(cfg.drop){
          const badge = document.createElement('img');
          badge.className = 'coin-drop-badge';
          badge.src = 'coinsdrop.png';
          badge.alt = 'Fındık Coin ödüllü oyun';
          dropCard.appendChild(badge);
        }
      }

      /* banner görseli */
      const bgUrl = clOpt(clGet('hp_card_'+key), 600);
      if(bgUrl){ const i=document.getElementById('img-'+key); if(i){i.src=bgUrl;i.classList.add('on');} }

      /* url */
      if(cfg.url){ const c=document.getElementById('card-'+key); if(c) c.setAttribute('href',cfg.url); }

      /* aktif/deaktif */
      const card = document.getElementById('card-'+key);
      const isActive = cfg.active!==undefined ? cfg.active!==false : !DEFAULT_INACTIVE_GAMES.includes(key);
      if(card){ card.classList.toggle('inactive',!isActive); }

      /* deaktif etiketi */
      const inactOverlay = document.getElementById('inact-'+key);
      if(inactOverlay){
        const inactImg = document.getElementById('inact-img-'+key);
        const inactTxt = document.getElementById('inact-txt-'+key);
        const inactUrl = clOpt(clGet('hp_inact_'+key), 400);
        const inactLabel = cfg.inactLabel||'YAKINDA';
        if(inactUrl && inactImg){ inactImg.src=inactUrl; inactImg.classList.add('on'); if(inactTxt) inactTxt.style.display='none'; }
        else { if(inactImg) inactImg.classList.remove('on'); if(inactTxt){ inactTxt.textContent=inactLabel; inactTxt.style.display=''; } }
      }
    });
  }catch(e){}
}

/* Önce localStorage'daki (önceki ziyaretten kalma) ayarları ANINDA uygula — sayfa asla boş açılmasın.
   Ardından jsonbin.io'dan taze veriyi arka planda çek ve değişen bir şey varsa sessizce güncelle. */
applySettings();
initHomepageMusic();
syncConfig().then(()=>{applySettings();initHomepageMusic();});


function initHomepageMusic(){
  const url=clGet('hp_home_music'); let audio=document.getElementById('homepage-music'); let control=document.getElementById('homepage-audio-control');
  if(!url){audio?.pause();if(control)control.hidden=true;return}
  if(!audio){audio=document.createElement('audio');audio.id='homepage-music';audio.loop=true;audio.preload='metadata';document.body.appendChild(audio)}
  if(audio.dataset.source!==url){audio.pause();audio.src=url;audio.dataset.source=url;audio.load()}
  if(!control){
    control=document.createElement('div');control.id='homepage-audio-control';control.className='homepage-audio-control';control.innerHTML='<button type="button" class="homepage-audio-toggle" aria-label="Müziği aç veya kapat">♪</button><div class="homepage-audio-volume"><input type="range" min="0" max="100" value="35" aria-label="Müzik ses seviyesi"><span>%35</span></div>';document.body.appendChild(control);
    const toggle=control.querySelector('.homepage-audio-toggle'),range=control.querySelector('input'),label=control.querySelector('span');
    const setVolume=value=>{const v=Math.max(0,Math.min(100,Number(value)||0));audio.volume=v/100;range.value=v;label.textContent='%'+v;localStorage.setItem('hp_music_volume',String(v));toggle.classList.toggle('muted',v===0);toggle.textContent=v===0?'×':'♪'};
    const setPlaying=playing=>{toggle.classList.toggle('playing',playing);toggle.textContent=audio.volume===0?'×':(playing?'Ⅱ':'♪')};
    setVolume(localStorage.getItem('hp_music_volume')||35);
    range.addEventListener('input',()=>{setVolume(range.value);if(audio.paused&&audio.volume>0)audio.play().then(()=>setPlaying(true)).catch(()=>{})});
