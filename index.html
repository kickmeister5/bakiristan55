<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oyun Merkezi</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#f0c040;--bg:#07070f;--surface:#10101a;--surface2:#18182a;
  --border:rgba(240,192,64,0.15);--border2:rgba(240,192,64,0.3);
  --text:#f0ead8;--muted:#6a6680;
  --font-title:'Bebas Neue',sans-serif;--font-body:'Outfit',sans-serif;
  --card-min-w:150px;--card-banner-h:150px;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-2;
  background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(240,192,64,0.04) 0%,transparent 60%),
             radial-gradient(ellipse 40% 60% at 80% 80%,rgba(100,80,200,0.04) 0%,transparent 60%);}
#bg-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;transition:opacity 0.5s;}

#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 60px;}

/* HEADER IMAGE */
.site-header{width:100%;display:none;flex-shrink:0;}
.site-header.on{display:block;}
.site-header img{width:100%;height:auto;display:block;object-fit:contain;}

/* GAMES GRID */
.games-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;width:100%;max-width:1280px;
  padding:40px 20px 0;
}
@media (max-width:980px){
  .games-grid{grid-template-columns:repeat(2,1fr);max-width:700px;}
}
@media (max-width:520px){
  .games-grid{grid-template-columns:1fr;max-width:420px;}
}

/* GAME CARD — sadece banner */
.game-card{
  border-radius:18px;overflow:hidden;cursor:pointer;
  transition:all 0.25s cubic-bezier(0.25,0.8,0.25,1);
  text-decoration:none;display:block;position:relative;
  border:1px solid rgba(255,255,255,0.06);
}
.game-card:hover{transform:translateY(-5px);box-shadow:0 20px 50px rgba(0,0,0,0.5);}
.game-card.inactive{cursor:default;pointer-events:none;}

/* BANNER */
.gc-banner{
  width:100%;height:var(--card-banner-h,300px);
  position:relative;overflow:hidden;display:block;
  background:#0a0a14;
}
.gc-banner img.gc-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
.gc-banner img.gc-bg.on{display:block;}
.gc-banner-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;filter:drop-shadow(0 4px 24px rgba(0,0,0,0.6));animation:floatIcon 3s ease-in-out infinite;}
@keyframes floatIcon{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.gc-banner img.gc-bg.on ~ .gc-banner-icon{display:none;}

/* INACTIVE OVERLAY */
.gc-inactive-overlay{
  position:absolute;inset:0;z-index:5;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.55);
}
.game-card.inactive .gc-inactive-overlay{display:flex;}
.gc-inactive-img{max-width:70%;max-height:70%;object-fit:contain;display:none;}
.gc-inactive-img.on{display:block;}
.gc-inactive-default{font-family:var(--font-title);font-size:clamp(16px,3vw,26px);letter-spacing:3px;color:rgba(255,255,255,0.7);}
</style>
</head>
<body>
<div id="bg-layer"></div>
<div id="app">

  <!-- HEADER GÖRSELİ -->
  <div class="site-header" id="site-header">
    <img id="site-header-img" src="" alt="Header">
  </div>

  <div class="games-grid" id="games-grid">

    <!-- VAR MISIN YOK MUSUN -->
    <a href="vmym.html" class="game-card" id="card-vmym">
      <div class="gc-banner">
        <img class="gc-bg" id="img-vmym" src="" alt="">
        <div class="gc-banner-icon">🎁</div>
        <div class="gc-inactive-overlay" id="inact-vmym">
          <img class="gc-inactive-img" id="inact-img-vmym" src="" alt="">
          <div class="gc-inactive-default" id="inact-txt-vmym">YAKINDA</div>
        </div>
      </div>
    </a>

    <!-- FAUL -->
    <a href="faul.html" class="game-card" id="card-faul">
      <div class="gc-banner">
        <img class="gc-bg" id="img-faul" src="" alt="">
        <div class="gc-banner-icon">🚨</div>
        <div class="gc-inactive-overlay" id="inact-faul">
          <img class="gc-inactive-img" id="inact-img-faul" src="" alt="">
          <div class="gc-inactive-default" id="inact-txt-faul">YAKINDA</div>
        </div>
      </div>
    </a>

    <!-- OYUN 3 -->
    <a href="#" class="game-card inactive" id="card-game3">
      <div class="gc-banner">
        <img class="gc-bg" id="img-game3" src="" alt="">
        <div class="gc-banner-icon">🎯</div>
        <div class="gc-inactive-overlay" id="inact-game3">
          <img class="gc-inactive-img" id="inact-img-game3" src="" alt="">
          <div class="gc-inactive-default" id="inact-txt-game3">YAKINDA</div>
        </div>
      </div>
    </a>

    <!-- OYUN 4 -->
    <a href="#" class="game-card inactive" id="card-game4">
      <div class="gc-banner">
        <img class="gc-bg" id="img-game4" src="" alt="">
        <div class="gc-banner-icon">🎲</div>
        <div class="gc-inactive-overlay" id="inact-game4">
          <img class="gc-inactive-img" id="inact-img-game4" src="" alt="">
          <div class="gc-inactive-default" id="inact-txt-game4">YAKINDA</div>
        </div>
      </div>
    </a>

  </div>

</div>

<script>
const BIN_ID  = '6a2a8f27f5f4af5e29de21ee';
const BIN_KEY = '$2a$10$jmvujdFyJ.mML6da40FEleAhD1/oz/xVD612cQ6NAxRM4oQedpnBi';

function clGet(key){
  try{ return (JSON.parse(localStorage.getItem('vmym_cl_urls'))||{})[key]||null; }catch(e){ return null; }
}

async function syncConfig(){
  try{
    const res = await fetch('https://api.jsonbin.io/v3/b/'+BIN_ID+'/latest',{headers:{'X-Master-Key':BIN_KEY}});
    if(!res.ok) return;
    const rec = (await res.json()).record||{};
    ['hp_bg','hp_card_w','hp_card_h','hp_cards','hp_header','vmym_cl_urls'].forEach(k=>{
      if(rec[k]!==undefined) localStorage.setItem(k, typeof rec[k]==='string'?rec[k]:JSON.stringify(rec[k]));
    });
  }catch(e){}
}

function applySettings(){
  /* 1 — arkaplan */
  try{
    const bg = JSON.parse(localStorage.getItem('hp_bg')||'{}');
    const layer = document.getElementById('bg-layer');
    if(bg.mode==='color'){
      layer.style.background = bg.color||'#07070f';
      document.body.style.background='transparent';
    } else if(bg.mode==='image'){
      const url = clGet('hp_bg_img');
      if(url){
        const fit={cover:'center/cover no-repeat fixed',contain:'center/contain no-repeat fixed',repeat:'top left repeat fixed',center:'center/auto no-repeat fixed'};
        layer.style.background = "url('"+url+"') "+(fit[bg.fit]||fit.cover);
        layer.style.opacity = ((bg.opacity||100)/100).toString();
        document.body.style.background='transparent';
      }
    }
  }catch(e){}

  /* 2 — header görseli */
  try{
    const hdr = JSON.parse(localStorage.getItem('hp_header')||'{}');
    const wrap = document.getElementById('site-header');
    const img  = document.getElementById('site-header-img');
    const url  = clGet('hp_header_img');
    if(url && hdr.show!==false){
      img.src=url; wrap.classList.add('on');
      if(hdr.maxW) img.style.maxWidth=hdr.maxW+'px';
    } else {
      wrap.classList.remove('on');
    }
  }catch(e){}

  /* 3 — kart boyutları */
  try{
    const w = JSON.parse(localStorage.getItem('hp_card_w')||'150');
    const h = JSON.parse(localStorage.getItem('hp_card_h')||'150');
    document.documentElement.style.setProperty('--card-min-w',w+'px');
    document.documentElement.style.setProperty('--card-banner-h',h+'px');
  }catch(e){}

  /* 4 — kart görselleri + aktiflik + deaktif etiketi */
  try{
    const cards = JSON.parse(localStorage.getItem('hp_cards')||'{}');
    ['vmym','faul','game3','game4'].forEach(key=>{
      const cfg = cards[key]||{};

      /* banner görseli */
      const bgUrl = clGet('hp_card_'+key);
      if(bgUrl){ const i=document.getElementById('img-'+key); if(i){i.src=bgUrl;i.classList.add('on');} }

      /* url */
      if(cfg.url){ const c=document.getElementById('card-'+key); if(c) c.setAttribute('href',cfg.url); }

      /* aktif/deaktif */
      const card = document.getElementById('card-'+key);
      const isActive = cfg.active!==false; // default aktif
      if(card){ card.classList.toggle('inactive',!isActive); }

      /* deaktif etiketi */
      const inactOverlay = document.getElementById('inact-'+key);
      if(inactOverlay){
        const inactImg = document.getElementById('inact-img-'+key);
        const inactTxt = document.getElementById('inact-txt-'+key);
        const inactUrl = clGet('hp_inact_'+key);
        const inactLabel = cfg.inactLabel||'YAKINDA';
        if(inactUrl && inactImg){ inactImg.src=inactUrl; inactImg.classList.add('on'); if(inactTxt) inactTxt.style.display='none'; }
        else { if(inactImg) inactImg.classList.remove('on'); if(inactTxt){ inactTxt.textContent=inactLabel; inactTxt.style.display=''; } }
      }
    });
  }catch(e){}
}

syncConfig().then(applySettings);
</script>
</body>
</html>
